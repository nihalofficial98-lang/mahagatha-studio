# UNTESTED draft: renders the next episode that has a voiceover. Needs: Actions enabled, repo write access.
name: daily-render
on:
  workflow_dispatch: {inputs: {episode: {description: "e.g. 03", required: true}, res: {default: "1080p"}}}
  schedule: [{cron: "30 3 * * *"}]   # edit to your daily time (UTC)
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg && pip install edge-tts pillow playwright && npm install && npm i -g playwright && npx playwright install --with-deps chromium
      - run: python3 studio/studio.py shots ${{ inputs.episode }} && python3 studio/studio.py qa ${{ inputs.episode }}
        env: {NODE_PATH: "/usr/local/lib/node_modules"}
      - run: python3 studio/studio.py render ${{ inputs.episode }} --res ${{ inputs.res || '1080p' }} --workers 3
        env: {NODE_PATH: "/usr/local/lib/node_modules"}
      - uses: softprops/action-gh-release@v2
        with: {tag_name: "ep${{ inputs.episode }}", files: renders/*.mp4}
